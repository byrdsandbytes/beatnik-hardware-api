devices:
  samplerate: 44100 # AirPlay and Spotify sources output 44100:16:2
  chunksize: 1024
  capture:
    type: Stdin # Audio from the player (shairport-sync / librespot)
    channels: 2
    format: S16LE
  playback:
    type: Stdout # Audio to Snapserver
    channels: 2
    format: S16LE

# Simple bass/mid/treble tone control applied to this stream before it reaches Snapserver
filters:
  bass:
    type: Biquad
    parameters:
      type: Lowshelf
      freq: 100
      slope: 6
      gain: 0
  mid:
    type: Biquad
    parameters:
      type: Peaking
      freq: 1000
      q: 0.7
      gain: 0
  high:
    type: Biquad
    parameters:
      type: Highshelf
      freq: 5000
      slope: 6
      gain: 0

pipeline:
  - type: Filter
    channel: 0
    names:
      - bass
      - mid
      - high
  - type: Filter
    channel: 1
    names:
      - bass
      - mid
      - high
