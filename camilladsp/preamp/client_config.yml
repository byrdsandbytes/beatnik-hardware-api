devices:
  samplerate: 44100
  chunksize: 4096  # Larger chunks avoid underruns; latency is irrelevant for line-in
  # The HiFiBerry ADC only captures at 48000 Hz; resample to the 44100 Hz pipeline rate
  capture_samplerate: 48000
  resampler:
    type: Synchronous  # 48000 -> 44100 is an exact 160:147 ratio; much cheaper than async
  capture:
    type: Alsa
    channels: 2
    device: "hw:1,0"  # Replace with your ADC device
    format: S32LE
  playback:
    type: File
    channels: 2
    filename: "/tmp/snapcast/snap-line-in" # The pipe sent to Snapserver
    format: S16LE

# Intentionally empty: audio passes through unchanged
filters: {}

pipeline: []
