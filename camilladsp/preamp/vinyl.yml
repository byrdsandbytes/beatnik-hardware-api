devices:
  samplerate: 44100  # Must be 44100 to match the custom RIAA biquad coefficients below
  chunksize: 1024
  capture:
    type: Alsa
    channels: 2
    device: "hw:1,0"  # Replace with your ADC device from step 2
    format: S16LE
  playback:
    type: File
    channels: 2
    filename: "/tmp/snapcast/snap-line-in" # The pipe sent to Snapserver
    format: S16LE

filters:
  preamp:
    type: Gain
    parameters:
      gain: 35.0  # Boost for direct phono connection (to compensate for low -55dB input)
      inverted: false
      mute: false

  riaa_custom_biquad:
    type: Biquad
    parameters:
      type: Free
      # These are pre-calculated digital RIAA reproduction coefficients for 44.1kHz ONLY
      b0: 1.0000000000
      b1: -0.7218922000
      b2: -0.1860520545
      a1: -1.7007240000
      a2: 0.7029381524

  subsonic:
    type: Biquad
    parameters:
      type: Highpass
      freq: 35
      q: 0.707

pipeline:
  - type: Filter
    channel: 0
    names:
      - preamp
      - riaa_custom_biquad
      - subsonic
  - type: Filter
    channel: 1
    names:
      - preamp
      - riaa_custom_biquad
      - subsonic