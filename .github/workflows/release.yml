name: Build and Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies and build
        run: |
          npm ci
          npm run pack-pi
          npm ci --omit=dev

      - name: Build Debian package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ROOT=package_root
          mkdir -p $ROOT/opt/beatnik-hardware-api $ROOT/etc/systemd/system $ROOT/usr/bin $ROOT/DEBIAN
          cp -r dist camilladsp node_modules package.json $ROOT/opt/beatnik-hardware-api/

          cp beatnik-hardware.service camilladsp.service camilladsp-preamp.service $ROOT/etc/systemd/system/

          # Snapserver stream sources with per-stream CamillaDSP; the wrapper picks its stream from its own name
          install -m 755 scripts/beatnik-stream-dsp $ROOT/usr/bin/beatnik-stream-dsp
          for stream in airplay airplay2 spotify; do
            ln -s beatnik-stream-dsp $ROOT/usr/bin/beatnik-dsp-$stream
          done

          cat > $ROOT/DEBIAN/control <<EOF
          Package: beatnik-hardware-api
          Version: ${VERSION}
          Section: base
          Priority: optional
          Architecture: all
          Depends: nodejs (>= 22.0.0)
          Maintainer: Beatnik <maintainer@example.com>
          Description: Microservice to configure Raspberry Pi Hardware & CamillaDSP
          EOF

          cat > $ROOT/DEBIAN/postinst <<'EOF'
          #!/bin/sh
          set -e
          systemctl daemon-reload
          systemctl enable beatnik-hardware.service
          systemctl restart beatnik-hardware.service
          # CamillaDSP binary is not part of this package; do not fail the install without it
          systemctl enable camilladsp.service || true
          systemctl restart camilladsp.service || true
          systemctl enable camilladsp-preamp.service || true
          systemctl restart camilladsp-preamp.service || true
          EOF

          cat > $ROOT/DEBIAN/prerm <<'EOF'
          #!/bin/sh
          systemctl stop beatnik-hardware.service || true
          systemctl disable beatnik-hardware.service || true
          systemctl stop camilladsp.service || true
          systemctl disable camilladsp.service || true
          systemctl stop camilladsp-preamp.service || true
          systemctl disable camilladsp-preamp.service || true
          EOF
          chmod 755 $ROOT/DEBIAN/postinst $ROOT/DEBIAN/prerm

          dpkg-deb --root-owner-group --build $ROOT beatnik-hardware-api_${VERSION}_all.deb

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            beatnik-hardware-api.tar.gz
            beatnik-hardware-api_*_all.deb
